<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 10 - Advanced CSS Effects</title>
    <link rel="stylesheet" href="../styles/effects.css">
</head>
<body>
    <h1 class="gradient-text">Advanced CSS Showcase</h1>

    <section class="effect-box">
        <h3>1. Custom Checkbox</h3>
        <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Check me out
        </label>
    </section>

    <section class="effect-box">
        <h3>2. Loading Animation</h3>
        <div class="loader"></div>
    </section>

    <section class="effect-box">
        <h3>3. Text Clipping</h3>
        <div class="clipped-text">CIRCUIT BOARD</div>
    </section>
</body>
</html>
