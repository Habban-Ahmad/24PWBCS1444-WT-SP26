<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10: Media Query Demo</title>
    <link rel="stylesheet" href="../styles/media-queries.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
    <div class="breakpoint-indicator">
        Current Device: <span class="device-label">Mobile</span>
    </div>

    <section class="demo-content">
        <h1>Typography Scaling Demo</h1>
        <p class="scaling-text">
            My size changes automatically based on your screen width! 
            This demonstrates responsive typography.
        </p>

        <div class="layout-box">
            <h2>Layout Change Demo</h2>
            <p>On mobile, I am a single column. On desktop, I might have siblings!</p>
        </div>
    </section>
</body>
</html>
