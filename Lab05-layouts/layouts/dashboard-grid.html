<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9: Admin Dashboard</title>
    <link rel="stylesheet" href="../styles/grid.css">
    <link rel="stylesheet" href="../styles/flexbox.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <div class="sidebar-brand">UET Admin</div>
            <nav class="sidebar-nav">
                <ul>
                    <li>Dashboard</li>
                    <li>Analytics</li>
                    <li>Students</li>
                    <li>Settings</li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="main-header">
                <h2>Overview</h2>
                <div class="user-profile">Habban Ahmad</div>
            </header>

            <section class="stat-cards">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p>1,250</p>
                </div>
                <div class="stat-card">
                    <h3>Active Courses</h3>
                    <p>45</p>
                </div>
                <div class="stat-card">
                    <h3>Revenue</h3>
                    <p>RS. 500k</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
