<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6: CSS Grid Photo Gallery</title>
    <link rel="stylesheet" href="../styles/grid.css">
</head>
<body>
    <h1>Task 6: CSS Grid Gallery</h1>
    
    <div class="grid-gallery">
        <div class="gallery-item tall">
            <img src="../../Lab03-css/images/gallery/profile.JPG" alt="Profile">
            <div class="overlay"><span>Featured</span></div>
        </div>
        <div class="gallery-item">
            <img src="../../Lab03-css/images/gallery/iphone 17.jpg" alt="Product">
        </div>
        <div class="gallery-item wide">
            <img src="../../Lab03-css/images/gallery/iPhone 17 Pro.jpeg" alt="Wide view">
        </div>
        <div class="gallery-item">
            <img src="../../Lab03-css/images/gallery/Apple watch.jpg" alt="Small pic">
        </div>
        <div class="gallery-item">
            <img src="../../Lab03-css/images/gallery/Mac Book pro.jpg" alt="Small pic">
        </div>
    </div>
</body>
</html>
